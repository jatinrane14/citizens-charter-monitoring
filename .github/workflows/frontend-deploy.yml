name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/citizens-charter-monitoring-system/**'   # ✅ ONLY trigger when frontend changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/citizens-charter-monitoring-system   # ✅ run commands inside frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      # 🔽 Example: Deploy to S3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://svvv-minor-project/frontend --delete
